[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gdp-15-2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiolimiter>=1.2.1",
    "langchain-ollama>=1.0.1",
    "markdown-pdf>=1.13.1",
    "mcp>=1.26.0",
    "mcp-use[search]>=1.7.0",
    "newsapi-python>=0.2.7",
    "newspaper4k>=0.9.5",
    "nltk>=3.9.4",
    "pip>=26.0.1",
    "pytest>=9.0.2",
    "spacy>=3.8.11",
    "sqlmodel>=0.0.38",
]

# This tells hatchling exactly where your code lives
[tool.hatch.build.targets.wheel]
packages = ["src/geo_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
gdp-15-2026 = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "gdp-15-2026",
]
